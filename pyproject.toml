[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenrecord"
version = "0.2.0"
description = "AI data quality gatekeeper for multi-ERP vendor and spend data (Microsoft Fabric)"
requires-python = ">=3.10"
# Core dependencies only: this is what the Fabric Environment installs from the wheel.
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "rapidfuzz>=3.0"]

[project.optional-dependencies]
# Offline dev harness (Docker): lakehouse stand-in, agent API, UI, MLflow client, Azure OpenAI client.
stack = [
    "deltalake>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.40",
    "requests>=2.31",
    "mlflow-skinny>=3.0",
    "scikit-learn>=1.4",
    "skops>=0.10",
    "openai>=1.99",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
